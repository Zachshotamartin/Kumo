<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#18191b" />
    <meta name="description" content="Kumo is a collaborative canvas where ideas, interfaces, and connected boards move together in real time." />
    <meta property="og:title" content="Kumo | Connected visual workspace" />
    <meta property="og:description" content="Think visually, work together, and link one board directly into the next." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://kumo-7d8e1.firebaseapp.com" crossorigin />
    <link rel="preconnect" href="https://apis.google.com" crossorigin />
    <style>
      html, body, #root { min-height: 100%; margin: 0; }
      body { background: #17181a; }
      .kumo-boot { display: grid; min-height: 100vh; grid-template-columns: minmax(0, 1.3fr) minmax(390px, .7fr); color: #e8e6df; font-family: "Inter Variable", sans-serif; background: #17181a; }
      .kumo-boot-hero { position: relative; overflow: hidden; background-color: #252629; background-image: linear-gradient(rgb(255 255 255 / .035) 1px, transparent 1px), linear-gradient(90deg, rgb(255 255 255 / .035) 1px, transparent 1px); background-size: 30px 30px; }
      .kumo-boot h1 { position: absolute; top: 74%; left: 5.5%; width: min(52%, 470px); margin: 0; font-size: clamp(52px, 5.8vw, 78px); line-height: 1.02; letter-spacing: -.055em; }
      .kumo-boot-panel { border-left: 1px solid #3a3b3f; background: #17181a; }
      @media (max-width: 820px) { .kumo-boot { grid-template-columns: 1fr; } .kumo-boot-hero { min-height: 620px; } .kumo-boot-panel { display: none; } }
    </style>
    <title>Kumo | Connected visual workspace</title>
  </head>
  <body>
    <noscript>Kumo requires JavaScript to run the collaborative editor.</noscript>
    <div id="root"><main class="kumo-boot" aria-busy="true" aria-label="Kumo is loading"><section class="kumo-boot-hero"><h1>Every board can lead somewhere.</h1></section><aside class="kumo-boot-panel" aria-hidden="true"></aside></main></div>
    <script type="module" src="/embed/kumo-logo.js" async fetchpriority="low"></script>
    <script type="module" src="/src/index.tsx" async></script>
  </body>
</html>
