<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#18191b" />
    <meta name="description" content="Kumo is a collaborative canvas where ideas, interfaces, and connected boards move together in real time." />
    <meta property="og:title" content="Kumo | Connected visual workspace" />
    <meta property="og:description" content="Think visually, work together, and link one board directly into the next." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preload" href="/node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preconnect" href="https://kumo-7d8e1.firebaseapp.com" crossorigin />
    <link rel="preconnect" href="https://apis.google.com" crossorigin />
    <style>
      html, body, #root { min-height: 100%; margin: 0; }
      body { background: #1a1b1d; }
      .kumo-boot { display: flex; min-height: 100dvh; align-items: center; justify-content: center; flex-direction: column; gap: 18px; color: #e8e6df; font-family: system-ui, sans-serif; background-color: #1a1b1d; background-image: linear-gradient(rgb(255 255 255 / .035) 1px, transparent 1px), linear-gradient(90deg, rgb(255 255 255 / .035) 1px, transparent 1px); background-size: 28px 28px; }
      .kumo-boot-logo { width: 132px; height: 132px; }
      .kumo-boot-copy { display: grid; justify-items: center; gap: 7px; }
      .kumo-boot-word { font-size: 20px; font-weight: 800; letter-spacing: -.045em; }
      .kumo-boot-status { color: #a4a39d; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
    </style>
    <title>Kumo | Connected visual workspace</title>
  </head>
  <body>
    <noscript>Kumo requires JavaScript to run the collaborative editor.</noscript>
    <div id="root"><main class="kumo-boot" role="status" aria-label="Kumo is loading"><div class="kumo-boot-logo" aria-hidden="true"></div><div class="kumo-boot-copy"><span class="kumo-boot-word">Kumo</span><span class="kumo-boot-status">Opening your canvas</span></div></main></div>
    <script type="module" src="/embed/kumo-logo.js" async fetchpriority="low"></script>
    <script type="module" src="/src/index.tsx" async></script>
  </body>
</html>
