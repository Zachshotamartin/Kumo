name: CI and deploy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: kumo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  EXPECTED_VERCEL_EMAIL: zachsm@alumni.stanford.edu

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Validate configuration
        run: yarn validate:config

      - name: Lint
        run: yarn lint

      - name: Type-check
        run: yarn typecheck

      - name: Unit tests and coverage
        run: yarn test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage
          retention-days: 7

      - name: Production build
        run: yarn build

      - name: Install Playwright browsers
        run: yarn playwright install --with-deps chromium firefox webkit

      - name: Browser smoke tests
        run: yarn test:e2e

      - name: Upload browser report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  preview:
    name: Vercel preview
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: preview
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_PREVIEW_DOMAIN: kumo-preview-zach-2267.vercel.app
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      LIVEBLOCKS_SECRET_KEY: ${{ secrets.LIVEBLOCKS_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Verify Vercel account
        run: yarn verify:vercel-account
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Pull Vercel preview configuration
        run: ./node_modules/.bin/vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Validate Vercel preview runtime
        run: yarn validate:vercel-env .vercel/.env.preview.local
      - name: Build preview artifacts
        run: ./node_modules/.bin/vercel build --target=preview --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Verify preview function imports
        run: yarn verify:vercel-functions
      - name: Deploy preview artifacts
        id: deploy_preview
        shell: bash
        run: |
          deployment_url="$(./node_modules/.bin/vercel deploy --prebuilt --target=preview --token="$VERCEL_TOKEN")"
          if [[ ! "$deployment_url" =~ ^https://[^[:space:]]+$ ]]; then
            echo "Vercel returned an invalid preview URL" >&2
            exit 1
          fi
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Assign stable preview domain
        run: ./node_modules/.bin/vercel alias set "${{ steps.deploy_preview.outputs.url }}" "$VERCEL_PREVIEW_DOMAIN" --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Smoke-test deployed preview
        run: yarn verify:deployment "https://$VERCEL_PREVIEW_DOMAIN"
      - name: Install Chromium for authenticated full-stack verification
        run: yarn playwright install --with-deps chromium
      - name: Verify real Supabase and Liveblocks product workflows
        run: yarn verify:full-stack "https://$VERCEL_PREVIEW_DOMAIN" .vercel/.env.preview.local

  production:
    name: Vercel production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Verify Vercel account
        run: yarn verify:vercel-account
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Pull Vercel production configuration
        run: yarn vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Validate Vercel production runtime
        run: yarn validate:vercel-env .vercel/.env.production.local --require-push
      - name: Build production artifacts
        run: yarn vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Verify production function imports
        run: yarn verify:vercel-functions
      - name: Deploy production artifacts
        id: deploy_production
        shell: bash
        run: |
          deployment_url="$(yarn --silent vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})"
          if [[ ! "$deployment_url" =~ ^https://[^[:space:]]+$ ]]; then
            echo "Vercel returned an invalid production URL" >&2
            exit 1
          fi
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
      - name: Smoke-test production deployment
        run: yarn verify:deployment "${{ steps.deploy_production.outputs.url }}"
